<!doctype html>
<!--
  Shared terminal frame for apatureai README heroes (identical file in all six repos).
  Drop the real captured transcript into <pre>, set the command in the title bar,
  open with the repo's headless Chromium at width 1520, and screenshot the .frame
  element at deviceScaleFactor 2. Real bytes only — never invented output.
-->
<html>
<head><meta charset="utf-8"><style>html,body{margin:0;background:#161B22;padding:24px;}</style></head>
<body>
<div class="frame" style="width:760px;background:#0D1117;border:1px solid #30363D;border-radius:8px;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;">
  <div style="padding:10px 16px;border-bottom:1px solid #21262D;color:#8B949E;font-size:12px;">$ node packages/cli/dist/main.js</div>
  <pre style="margin:0;padding:18px 20px;color:#C9D1D9;font-size:13px;line-height:1.55;overflow:hidden;white-space:pre-wrap;">{{REAL CAPTURED BYTES}}</pre>
</div>
</body>
</html>
